[project]
name = "RTbehavior"
version = "1.0.0"
description = "Residence Time distribution and behavior analyis."
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Zafer Kosar"}
]
maintainers = [
    {name = "Zafer Kosar", email = "zafermolbio@gmail.com"}
]

readme = {file = "README.md", content-type="text/markdown"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "numpy==1.26.4",
    "scipy>=1.16",
    "statannot",
    "lets_plot",
    "polars >= 1.0.0",
    #"pandas >= 1.5.0, < 2",
    "seaborn == 0.12.2",
    "matplotlib >= 3.6.0",
    "cairosvg",
    "pyarrow",
    "rich",
    "ggrust>=0.8.1",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv.sources]
# Fig. 4 needs ggrust features newer than 0.8.1 (colorbar caps/frame, stat_poly_eq r/slope,
# infinite positions, gggrid tag_level="unit"); switch back to PyPI once they are released.
ggrust = { git = "https://github.com/datavil/ggrust", rev = "8458681f818b416f372f9d9f25dadc0486aa77de" }
